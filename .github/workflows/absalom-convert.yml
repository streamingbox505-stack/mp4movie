name: Absalom converter

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Vipindi vingi zaidi kwa run hii"
        default: "80"
      workers:
        description: "Downloads sambamba"
        default: "4"
      chunk:
        description: "Vipindi kwa commit moja ya HF"
        default: "4"
      only_slugs:
        description: "Slugs za kujaribu tu, zimetenganishwa kwa koma (acha tupu kwa zote)"
        default: ""
      dry_run:
        description: "1 = orodhesha tu, usipakue"
        default: "0"
  # Kila saa 2. Inaendeshwa tu ikiwa variable CONVERTER_ENABLED = 1 (tazama SETUP.md)
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: absalom-convert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  convert:
    if: github.event_name == 'workflow_dispatch' || vars.CONVERTER_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: converter/requirements.txt
      - name: Install
        run: |
          pip install -r converter/requirements.txt
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || \
            (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Convert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: jaynesmaxtv/movie-file
          HF_REPO_TYPE: ${{ vars.HF_REPO_TYPE || 'dataset' }}
          LIMIT: ${{ inputs.limit || '80' }}
          WORKERS: ${{ inputs.workers || '4' }}
          CHUNK: ${{ inputs.chunk || '4' }}
          ONLY_SLUGS: ${{ inputs.only_slugs || '' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          MAX_RUNTIME_MIN: "320"
          MIN_FREE_GB: "5"
        run: python converter/convert.py
