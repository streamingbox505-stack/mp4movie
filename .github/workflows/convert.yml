name: convert-episodes
on:
  schedule:
    - cron: "17 */2 * * *"     # kila masaa 2
  workflow_dispatch:
concurrency:
  group: convert
  cancel-in-progress: false     # run mbili zisigongane
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q requests gdown huggingface_hub
      - run: python convert.py
        env:
          CF_API: https://tr-admin.jaynes-max.workers.dev   # si siri (ufunguo wa ADMIN_KEY ndio unalinda)
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BATCH: "3"            # chanzo kingine kila kimoja
          BATCH_ABSALOM: "50"   # Absalom: 50 kwa kila run
          MAX_RUN_MIN: "300"    # usianze kazi mpya baada ya dakika 300
          NETS_SINCE_DAYS: "14"
          NETS_REPO: jaynesmaxtv/movie-file
          MAIN_REPO: jaynesmaxtv/movie-file
