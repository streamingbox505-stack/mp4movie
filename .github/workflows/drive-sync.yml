name: Drive to MP4 (auto)

on:
  schedule:
    - cron: "0 */3 * * *"   # kila saa 3
  workflow_dispatch:         # pia unaweza kuiendesha mwenyewe: Actions -> Run workflow

concurrency:
  group: drive-sync
  cancel-in-progress: false  # run moja tu kwa wakati

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Python deps
        run: pip install -q requests huggingface_hub imageio-ffmpeg
      - name: Sync
        run: python sync.py
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO || 'JAYNESTV/iphone-stream' }}
          BATCH: ${{ vars.BATCH || '5' }}
