name: Dub movie (Kiswahili)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL ya mp4 ya filamu (mf. https://huggingface.co/datasets/jaynesmaxtv/movie-file/resolve/main/videos/FAILI.mp4)"
        required: true
      name:
        description: "Jina la matokeo, bila nafasi (mf. brothers-under-fire)"
        required: true
      src_lang:
        description: "Lugha ya asili (en, fr, es...). Acha tupu = itatambuliwa yenyewe"
        required: false
      subtitle_url:
        description: "Manukuu ya asili (URL ya .srt au .vtt) unayoruhusiwa kuyatumia. Tupu = tafuta subs/<name>.srt kwenye repo"
        required: false
      sub_lang:
        description: "Lugha ya manukuu hayo (en, fr...)"
        required: false
        default: "en"
      audio_track:
        description: "Namba ya sauti ya asili kwenye faili (0 = ya kwanza; kwa faili zenye sauti nyingi chagua ya lugha ya asili)"
        required: false
        default: "0"
      prompt:
        description: "Majina ya wahusika/maneno magumu, yakitenganishwa kwa koma (yanasaidia Whisper kuandika majina sawasawa)"
        required: false
      separate:
        description: "Ondoa sauti ya waigizaji wa asili kwa Demucs (dubbing ya kweli; nzito, saa kadhaa). Zima = voice-over tu"
        type: boolean
        default: true
      bg_volume:
        description: "Sauti ya asili kwa voice-over (inatumika tu ikiwa separate imezimwa) 0.0 - 1.0"
        required: false
        default: "0.25"
      keep_original:
        description: "Weka pia sauti ya asili kama track ya pili"
        type: boolean
        default: false
      clone:
        description: "Cloning (majaribio): kila mwigizaji aongee Kiswahili kwa sauti yake (Chatterbox). Nzito kwenye CPU; weka clip_min kujaribu kwanza"
        type: boolean
        default: false
      clip_min:
        description: "Kujaribu haraka: shughulikia dakika N za kwanza tu (mf. 8). 0 = filamu nzima"
        required: false
        default: "0"
      lipcheck:
        description: "Baada ya kupakia, anzisha ukaguzi wa midomo na sauti (lipsync-check.yml)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write        # inahitajika kwa lipcheck

concurrency:
  group: dub-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # kikomo cha GitHub ni saa 6 kwa job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.clone && '3.11' || '3.12' }}   # chatterbox-tts imejaribiwa kwenye 3.11
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Hifadhi models (zisipakuliwe kila mara)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-dub-models-${{ inputs.clone && 'clone-' || '' }}v1     # cloning inapakua models za ziada (~3 GB), kwa hiyo cache yake ni tofauti
      - name: Weka zana
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q faster-whisper transformers sentencepiece numpy huggingface_hub
          pip install -q --no-deps demucs
          pip install -q julius einops pyyaml tqdm dora-search openunmix treetable lameenc
      - name: Weka Chatterbox (cloning)
        if: ${{ inputs.clone }}
        run: |
          pip install -q chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
          python -c "import torch, numpy, transformers, faster_whisper; from chatterbox.mtl_tts import ChatterboxMultilingualTTS; print('torch', torch.__version__, '| numpy', numpy.__version__, '| transformers', transformers.__version__)"
      - name: Fanya dubbing
        id: dub
        run: python dub_movie.py
        env:
          SRC_URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
          SRC_LANG: ${{ inputs.src_lang }}
          BG_VOLUME: ${{ inputs.bg_volume }}
          SEPARATE: ${{ inputs.separate && '1' || '0' }}
          SUBTITLE_URL: ${{ inputs.subtitle_url }}
          SUB_LANG: ${{ inputs.sub_lang }}
          AUDIO_TRACK: ${{ inputs.audio_track }}
          PROMPT: ${{ inputs.prompt }}
          VOICES_F: ${{ vars.VOICES_F }}          # repo za sauti za kike, zikitenganishwa kwa koma (muundo wa MMS/VITS); tupu = facebook/mms-tts-swh
          VOICES_M: ${{ vars.VOICES_M }}          # repo za sauti za kiume (jumla ya sauti zote hadi sita)
          DIARIZE: ${{ vars.DIARIZE || '1' }}     # tambua wazungumzaji
          SPK_THRESHOLD: ${{ vars.SPK_THRESHOLD || '0.35' }}
          EMOTION: ${{ vars.EMOTION || '1' }}     # tambua hisia
          CONDENSE: ${{ vars.CONDENSE || '1' }}   # fupisha mistari mirefu kwa kuzungumzwa
          WHISPER_BEAM: ${{ vars.WHISPER_BEAM || '3' }}
          PITCH_F: ${{ vars.PITCH_F || '1.5' }}
          PITCH_M: ${{ vars.PITCH_M || '-2.5' }}
          GENDER_SPLIT: ${{ vars.GENDER_SPLIT || '165' }}
          EXPRESSIVE: ${{ vars.EXPRESSIVE || '1' }}
          BG_SEP: ${{ vars.BG_SEP || '0.9' }}
          VOICE_GAIN: ${{ vars.VOICE_GAIN || '1.0' }}
          KEEP_ORIGINAL: ${{ inputs.keep_original && '1' || '0' }}
          CLONE: ${{ inputs.clone && '1' || '0' }}
          CLIP_MIN: ${{ inputs.clip_min }}
          CLONE_DEADLINE_MIN: ${{ vars.CLONE_DEADLINE_MIN || '250' }}   # baada ya dakika hizi tangu kuanza, mistari iliyobaki inatumia MMS
          CLONE_CFG: ${{ vars.CLONE_CFG || '0.5' }}
          CLONE_STRICT: ${{ vars.CLONE_STRICT || '1' }}   # 1 = cloning pekee, bila MMS; 0 = MMS ikiwa fallback
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'medium' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DUB_REPO: ${{ vars.DUB_REPO || 'jaynesmaxtv/movie-file' }}
          DUB_PREFIX: ${{ vars.DUB_PREFIX || 'dubbed/' }}
      - name: Anzisha ukaguzi wa midomo na sauti (hiari)
        if: ${{ inputs.lipcheck && steps.dub.outputs.url != '' }}
        run: gh workflow run lipsync-check.yml -f url="$DUB_URL" -f name="$NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          DUB_URL: ${{ steps.dub.outputs.url }}
          NAME: ${{ inputs.name }}
      - name: Ripoti ya usahihi wa Whisper (inafanya kazi tu kukiwa na manukuu ya asili)
        if: always()
        continue-on-error: true
        run: |
          SUB=""
          [ -f work/sub.txt ] && SUB=work/sub.txt
          [ -z "$SUB" ] && [ -f "subs/${{ inputs.name }}.srt" ] && SUB="subs/${{ inputs.name }}.srt"
          if [ -n "$SUB" ] && [ -f work/segments.json ]; then python compare_subs.py work/segments.json "$SUB" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Hifadhi faili za ukaguzi (maandishi, tafsiri, manukuu)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dub-${{ inputs.name }}
          path: |
            work/segments.json
            work/sw.json
            work/*.vtt
            work/quality.json
            work/quality.txt
            work/sub_match.json
            work/ref_spk*.wav
            work/voices/*
          if-no-files-found: ignore
          
