name: ngwele-converter

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Files per run"
        default: "100"

concurrency:
  group: ngwele-converter
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg and Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q gdown huggingface_hub requests
      - name: Convert and upload
        run: python ngwele.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BATCH: ${{ inputs.batch || '100' }}
          
