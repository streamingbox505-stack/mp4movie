name: Absalom movies converter

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Sehemu kwa run"
        default: "20"
      dry_run:
        description: "1 = orodhesha tu"
        default: "0"
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: absalom-movies-convert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: converter/requirements.txt
      - name: Install
        run: |
          pip install -r converter/requirements.txt
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || \
            (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Convert
        env:
          SUPABASE_URL: ${{ secrets.ABSALOM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ABSALOM_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET || 'jaynesmaxtv/movie-file' }}
          BATCH_SIZE: ${{ inputs.batch_size || '20' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          MAX_RUNTIME_MIN: "270"
          MIN_FREE_GB: "5"
        run: python converter/movie.py
